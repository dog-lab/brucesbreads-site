# Domain-level redirect: brucesbreads.org (and www) -> bruces-breads.com.
#
# Deliberately kept here rather than in public/_redirects, because that file
# is shared with the Cloudflare Pages deployment of this same repo, and
# Cloudflare Pages doesn't support host-scoped "from" matching -- it silently
# degrades a rule like this into a same-domain match, which caused a
# self-redirect loop on bruces-breads.com (Aug 15, 2026). netlify.toml is
# Netlify-proprietary config; Cloudflare Pages never reads it, so this can't
# leak across platforms the way public/_redirects did.
#
# force = true is required even though "to" is a different domain -- without
# it, Netlify only applies a redirect when no real file matches the request
# path, and this site has a real index.html/page at every path being
# redirected here.

[[redirects]]
  from = "https://brucesbreads.org/*"
  to = "https://bruces-breads.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.brucesbreads.org/*"
  to = "https://bruces-breads.com/:splat"
  status = 301
  force = true
